    effort_limit: 45.0
    velocity_limit: 12.25
    gain_group: "knee"

  - index: 4
    firmware_name: "L_Ankle_A"
    sim_joint: "left_ankle_pitch_joint"
    sign: "UNKNOWN"  # Physical motor A is part of parallel differential pair (handled in ankle_map.py)
    offset: "UNKNOWN"
    sim_range: [-0.3500, 0.3500]
    firmware_range: "UNKNOWN"  # Motor A actuator angle
    effort_limit: 40.0
    velocity_limit: 9.32
    gain_group: "ankle_pitch"

  - index: 5
    firmware_name: "L_Ankle_B"
    sim_joint: "left_ankle_roll_joint"
