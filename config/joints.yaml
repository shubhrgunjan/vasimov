    effort_limit: 28.0
    velocity_limit: 5.45
    gain_group: "hip_yaw"

  - index: 3
    firmware_name: "L_Knee"
    sim_joint: "left_knee_joint"
    sign: 1.0
    offset: 0.0
    sim_range: [0.0000, 1.5000]
