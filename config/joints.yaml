# vasimov/config/joints.yaml
# Joint convention and mapping table for Asimov 1.
# Ordered by Firmware CAN bus actuator index 0 through 24.
#
# Provenance:
# - Firmware indices and names: docs.menlo.ai/asimov/1/program/api/robot-control#joint-order [VERIFIED]
# - Sim joint names, effort limits, and velocity limits: sim-model/urdf/asimov_1.urdf [VERIFIED]
# - Sim ranges: sim-model/xmls/asimov_1.xml [VERIFIED]
# - Gain groups: isaac_asimov/source/cyclotron/cyclotron/assets/robots/asimov_1.py [VERIFIED]

joints:
  - index: 0
    firmware_name: "L_Hip_Pitch"
    sim_joint: "left_hip_pitch_joint"
    sign: 1.0
    offset: 0.0
    sim_range: [-1.5700, 1.5700]
    firmware_range: [-1.5700, 1.5700]
    effort_limit: 45.0
    velocity_limit: 12.57
    gain_group: "hip_pitch"

  - index: 1
    firmware_name: "L_Hip_Roll"
    sim_joint: "left_hip_roll_joint"
    sign: 1.0
    offset: 0.0
    sim_range: [-0.7854, 0.7854]
    firmware_range: [-0.7854, 0.7854]
    effort_limit: 45.0
    velocity_limit: 3.98
    gain_group: "hip_roll"

  - index: 2
