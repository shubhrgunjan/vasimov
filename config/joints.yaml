    firmware_range: "UNKNOWN"  # Motor B actuator angle
    effort_limit: 17.0
    velocity_limit: 9.32
    gain_group: "ankle_roll"

  - index: 6
    firmware_name: "R_Hip_Pitch"
    sim_joint: "right_hip_pitch_joint"
    sign: -1.0  # Axis [0, -1, 0]: negative sim rotation corresponds to forward pitch
    offset: 0.0
